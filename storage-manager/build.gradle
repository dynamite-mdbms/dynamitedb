repositories {
    mavenCentral()
}

dependencies {
    implementation project(':contracts')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('smDriver', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone Storage Manager test driver (SM-15).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dynamitedb.sm.verification.StorageTestDriver'
}

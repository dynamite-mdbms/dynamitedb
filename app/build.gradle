apply plugin: 'application'

repositories {
    mavenCentral()
}

application {
    mainClass = 'dynamitedb.app.Main'
}

dependencies {
    implementation project(':contracts')
    implementation project(':query-processor')
    implementation project(':query-optimizer')
    implementation project(':storage-manager')
    implementation project(':concurrency-manager')
    implementation project(':recovery-manager')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('run') {
    standardInput = System.in
}
